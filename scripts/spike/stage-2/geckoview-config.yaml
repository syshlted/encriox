# Gecko prefs for the stage 2 spike (W7; ROADMAP.md, item 4): stage 1's, with Lockstore's three switches on, all off
# by default at Firefox 160. A debuggable GeckoView reads this from /data/local/tmp/<package>-geckoview-config.yaml,
# and hands the prefs to Gecko as default prefs (MOZ_DEFAULT_PREFS).
#
# The first round kept Lockstore's own `local` key, which it keeps in plaintext in the profile's
# lockstore.keys.sqlite, so it measured what the switches cover, not what they protect; from the second, the app gives
# Gecko a secret from the vault's key, which the profile's keys are moved under (`check-kek`). The SQLite switch
# corrupts a profile it is turned on over, and Gecko refuses a profile whose databases disagree with it, so it goes on
# a fresh profile only (`fresh-profile`).
prefs:
  browser.privatebrowsing.forceMediaMemoryCache: true
  # SQLite through obfsvfs, every database under the profile but Lockstore's and NSS's own.
  security.storage.encryption.sqlite.enabled: true
  # The HTTP cache's entries.
  browser.cache.disk.encryption.enabled: true
  # Site storage, for each origin first seen with it on: IndexedDB, local storage, the Cache API.
  dom.quotaManager.encryption.enabled: true
env:
  # The databases' keys; the profile KEK the embedder's secret keeps (ProfileKek.cpp); the cookie store's open; and the
  # HTTP cache's key and directory.
  MOZ_LOG: SQLiteEncryption:4,ProfileKek:4,cookie:2,cache2:3
